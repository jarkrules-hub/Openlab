<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPENLAB</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .player {
            position: relative;
            width: 100%;
            height: 100vh;
            background: #000;
        }

        video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.75;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.35),
                transparent 45%,
                rgba(0,0,0,0.8)
            );
        }

        .content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
        }

        .title {
            font-size: 14px;
            letter-spacing: 5px;
            opacity: 0.8;
        }

        .track {
            margin-bottom: 20px;
        }

        .track-number {
            font-size: 12px;
            opacity: 0.6;
            margin-bottom: 8px;
        }

        .track-name {
            font-size: 28px;
            font-weight: 300;
        }

        .controls {
            margin-top: 25px;
        }

        button {
            background: none;
            border: 1px solid rgba(255,255,255,0.5);
            color: white;
            padding: 10px 18px;
            cursor: pointer;
            margin-right: 8px;
        }

        button:hover {
            background: rgba(255,255,255,0.1);
        }

        .progress {
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.25);
            margin-top: 20px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: white;
        }

        .tracks {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .tracks button {
            border: none;
            padding: 5px;
            opacity: 0.5;
        }

        .tracks button.active {
            opacity: 1;
        }

        @media (max-width: 600px) {
            .content {
                padding: 20px;
            }

            .track-name {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<div class="player">

    <!-- ВИДЕО -->
    <video id="visual" loop muted playsinline></video>

    <div class="overlay"></div>

    <div class="content">

        <div class="title">
            OPENLAB
        </div>

        <div>

            <div class="track">
                <div class="track-number" id="trackNumber">01</div>
                <div class="track-name" id="trackName">
                    TEST TRACK
                </div>
            </div>

            <div class="controls">

                <button onclick="togglePlay()" id="playButton">
                    PLAY
                </button>

                <div class="progress">
                    <div class="progress-bar" id="progressBar"></div>
                </div>

                <div class="tracks">

                    <button onclick="changeTrack(0)" class="active">
                        01
                    </button>

                    <button onclick="changeTrack(1)">
                        02
                    </button>

                    <button onclick="changeTrack(2)">
                        03
                    </button>

                    <button onclick="changeTrack(3)">
                        04
                    </button>

                    <button onclick="changeTrack(4)">
                        05
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

const tracks = [

    {
        name: "TEST TRACK",
        audio: "audio/01.mp3",
        video: "visuals/01.mp4"
    },

    {
        name: "TRACK TWO",
        audio: "audio/02.mp3",
        video: "visuals/02.mp4"
    },

    {
        name: "TRACK THREE",
        audio: "audio/03.mp3",
        video: "visuals/03.mp4"
    },

    {
        name: "TRACK FOUR",
        audio: "audio/04.mp3",
        video: "visuals/04.mp4"
    },

    {
        name: "TRACK FIVE",
        audio: "audio/05.mp3",
        video: "visuals/05.mp4"
    }

];

let currentTrack = 0;

const audio = new Audio();

const video = document.getElementById("visual");

const playButton = document.getElementById("playButton");

const progressBar = document.getElementById("progressBar");

const trackName = document.getElementById("trackName");

const trackNumber = document.getElementById("trackNumber");


function loadTrack(index) {

    currentTrack = index;

    const track = tracks[index];

    audio.src = track.audio;

    video.src = track.video;

    trackName.textContent = track.name;

    trackNumber.textContent =
        String(index + 1).padStart(2, "0");

    document.querySelectorAll(".tracks button")
        .forEach((button, i) => {

            button.classList.toggle(
                "active",
                i === index
            );

        });

    audio.load();

}


function togglePlay() {

    if (audio.paused) {

        audio.play();

        video.play();

        playButton.textContent = "PAUSE";

    } else {

        audio.pause();

        video.pause();

        playButton.textContent = "PLAY";

    }

}


audio.addEventListener("timeupdate", () => {

    if (!audio.duration) return;

    const percent =
        (audio.currentTime / audio.duration) * 100;

    progressBar.style.width =
        percent + "%";

});


audio.addEventListener("ended", () => {

    const next =
        (currentTrack + 1) % tracks.length;

    loadTrack(next);

    audio.play();

    video.play();

});


function changeTrack(index) {

    loadTrack(index);

    audio.play();

    video.play();

    playButton.textContent = "PAUSE";

}


loadTrack(0);

</script>

</body>
</html>
