<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OPENLAB</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 90%;
    max-width: 900px;
    text-align: center;
}

/* Название */
.logo {
    font-size: 13px;
    letter-spacing: 8px;
    opacity: 0.7;
    margin-bottom: 25px;
}

/* Видео */
.video-container {
    width: 100%;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
}

video {
    width: 100%;
    max-height: 60vh;
    object-fit: contain;
    display: block;
}

/* Информация о треке */
.track-number {
    margin-top: 25px;
    font-size: 12px;
    letter-spacing: 5px;
    opacity: 0.5;
}

.track-title {
    margin-top: 10px;
    font-size: 22px;
    letter-spacing: 3px;
}

/* PLAY */
.play-button {
    margin-top: 25px;
    padding: 12px 40px;
    background: transparent;
    border: 1px solid #555;
    color: white;
    font-size: 12px;
    letter-spacing: 4px;
    cursor: pointer;
}

.play-button:hover {
    background: white;
    color: black;
}

/* Выбор треков */
.tracks {
    margin-top: 35px;
    display: flex;
    justify-content: center;
    gap: 20px;
}

.track-button {
    background: none;
    border: none;
    color: #555;
    font-size: 12px;
    cursor: pointer;
    padding: 5px;
}

.track-button.active {
    color: white;
}

/* На телефоне */
@media (max-width: 600px) {

    .track-title {
        font-size: 17px;
    }

    video {
        max-height: 45vh;
    }

    .tracks {
        gap: 14px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        OPENLAB
    </div>

    <div class="video-container">
        <video id="visual" playsinline>
            <source src="video1.mp4" type="video/mp4">
        </video>
    </div>

    <div class="track-number" id="trackNumber">
        01
    </div>

    <div class="track-title" id="trackTitle">
        ХОТЕЛ БЫТЬ КАК ВСЕ
    </div>

    <button class="play-button" id="playButton">
        PLAY
    </button>

    <audio id="music">
        <source src="track1.mp3" type="audio/mpeg">
    </audio>

    <div class="tracks">

        <button class="track-button active">01</button>
        <button class="track-button">02</button>
        <button class="track-button">03</button>
        <button class="track-button">04</button>
        <button class="track-button">05</button>

    </div>

</div>

<script>

const video = document.getElementById("visual");
const music = document.getElementById("music");
const playButton = document.getElementById("playButton");

let playing = false;

playButton.addEventListener("click", async () => {

    if (!playing) {

        try {

            await music.play();
            await video.play();

            playing = true;
            playButton.textContent = "PAUSE";

        } catch (error) {

            console.log("Ошибка воспроизведения:", error);

        }

    } else {

        music.pause();
        video.pause();

        playing = false;
        playButton.textContent = "PLAY";
    }

});

/* Когда музыка закончилась */
music.addEventListener("ended", () => {

    video.pause();
    video.currentTime = 0;

    playing = false;
    playButton.textContent = "PLAY";

});

</script>

</body>
</html>
