<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OPENLAB</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 90%;
    max-width: 900px;
    text-align: center;
}

.title {
    font-size: 14px;
    letter-spacing: 8px;
    margin-bottom: 35px;
    opacity: 0.7;
}

.video-box {
    width: 100%;
    max-height: 65vh;
    background: #000;
    overflow: hidden;
}

video {
    width: 100%;
    height: auto;
    max-height: 65vh;
    display: block;
    object-fit: contain;
}

.track-number {
    margin-top: 30px;
    font-size: 12px;
    letter-spacing: 4px;
    opacity: 0.5;
}

.track-name {
    margin-top: 10px;
    font-size: 22px;
    letter-spacing: 3px;
}

button {
    margin-top: 30px;
    background: none;
    border: 1px solid #555;
    color: white;
    padding: 12px 35px;
    cursor: pointer;
    letter-spacing: 3px;
    font-size: 12px;
}

button:hover {
    background: white;
    color: black;
}

audio {
    display: none;
}
</style>
</head>

<body>

<div class="container">

    <div class="title">OPENLAB</div>

    <div class="video-box">
        <video id="visual" loop playsinline>
            <source src="./video1.mp4" type="video/mp4">
        </video>
    </div>

    <div class="track-number">01</div>

    <div class="track-name">
        ХОТЕЛ БЫТЬ КАК ВСЕ
    </div>

    <audio id="music" src="./track1.mp3"></audio>

    <button id="playButton">PLAY</button>

</div>

<script>

const video = document.getElementById("visual");
const music = document.getElementById("music");
const button = document.getElementById("playButton");

button.addEventListener("click", function() {

    if (music.paused) {

        music.play();
        video.play();

        button.textContent = "PAUSE";

    } else {

        music.pause();
        video.pause();

        button.textContent = "PLAY";
    }

});

music.addEventListener("ended", function() {

    video.pause();
    video.currentTime = 0;

    button.textContent = "PLAY";

});

</script>

</body>
</html>
