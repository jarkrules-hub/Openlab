<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OPENLAB</title>

<style>
body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.box {
    width: 90%;
    max-width: 800px;
    text-align: center;
}

video {
    width: 100%;
    max-height: 60vh;
    background: #000;
}

button {
    margin-top: 30px;
    padding: 15px 40px;
    background: #000;
    color: white;
    border: 1px solid #555;
    cursor: pointer;
    font-size: 14px;
    letter-spacing: 3px;
}
</style>
</head>

<body>

<div class="box">

    <video id="video" playsinline preload="metadata">
        <source src="./video1.mp4" type="video/mp4">
    </video>

    <br>

    <button id="play">PLAY</button>

    <audio id="audio" preload="metadata">
        <source src="./track1.mp3" type="audio/mpeg">
    </audio>

</div>

<script>

const video = document.getElementById("video");
const audio = document.getElementById("audio");
const button = document.getElementById("play");

button.addEventListener("click", async function () {

    try {

        if (audio.paused) {

            await audio.play();
            await video.play();

            button.textContent = "PAUSE";

        } else {

            audio.pause();
            video.pause();

            button.textContent = "PLAY";
        }

    } catch (error) {

        alert("Ошибка запуска: " + error.message);

        console.log(error);
    }

});

</script>

</body>
</html>
