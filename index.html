<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OPENLAB</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 90%;
    max-width: 850px;
    text-align: center;
}

/* OPENLAB */

.logo {
    font-size: 13px;
    letter-spacing: 8px;
    opacity: 0.6;
    margin-bottom: 30px;
}

/* VIDEO */

.video-box {
    width: 100%;
    background: #000;
    display: flex;
    justify-content: center;
}

video {
    width: 100%;
    max-height: 60vh;
    object-fit: contain;
    display: block;
}

/* TRACK */

.track-number {
    margin-top: 25px;
    font-size: 11px;
    letter-spacing: 5px;
    opacity: 0.45;
}

.track-title {
    margin-top: 10px;
    font-size: 21px;
    letter-spacing: 3px;
}

/* PLAY */

.play-button {
    margin-top: 25px;
    padding: 12px 38px;

    background: transparent;
    border: 1px solid #555;

    color: #fff;

    font-size: 11px;
    letter-spacing: 4px;

    cursor: pointer;
}

.play-button:hover {
    background: #fff;
    color: #000;
}

/* TRACK NUMBERS */

.tracks {
    margin-top: 35px;
    display: flex;
    justify-content: center;
    gap: 18px;
}

.track-button {
    background: transparent;
    border: none;

    color: #444;

    font-size: 11px;
    letter-spacing: 2px;

    cursor: pointer;
}

.track-button.active {
    color: #fff;
}

/* MOBILE */

@media (max-width: 600px) {

    .container {
        width: 94%;
    }

    video {
        max-height: 45vh;
    }

    .track-title {
        font-size: 17px;
    }

    .tracks {
        gap: 12px;
    }
}

</style>
</head>


<body>

<div class="container">

    <div class="logo">
        OPENLAB
    </div>


    <div class="video-box">

        <video
            id="video"
            playsinline
            preload="auto"
        >
            <source
                src="video1.mp4"
                type="video/mp4"
            >
        </video>

    </div>


    <div class="track-number">
        01
    </div>


    <div class="track-title">
        ХОТЕЛ БЫТЬ КАК ВСЕ
    </div>


    <button
        class="play-button"
        id="playButton"
    >
        PLAY
    </button>


    <audio
        id="audio"
        preload="auto"
    >
        <source
            src="track1.mp3"
            type="audio/mpeg"
        >
    </audio>


    <div class="tracks">

        <button
            class="track-button active"
        >
            01
        </button>

        <button
            class="track-button"
        >
            02
        </button>

        <button
            class="track-button"
        >
            03
        </button>

        <button
            class="track-button"
        >
            04
        </button>

        <button
            class="track-button"
        >
            05
        </button>

    </div>

</div>


<script>

const video = document.getElementById("video");
const audio = document.getElementById("audio");
const playButton = document.getElementById("playButton");


playButton.addEventListener("click", async function() {

    if (audio.paused) {

        try {

            await audio.play();

            await video.play();

            playButton.textContent = "PAUSE";

        }

        catch (error) {

            console.log(error);

            alert(
                "Не удалось запустить видео. " +
                "Проверь файл video1.mp4."
            );

        }

    }

    else {

        audio.pause();

        video.pause();

        playButton.textContent = "PLAY";

    }

});


audio.addEventListener("ended", function() {

    audio.pause();

    video.pause();

    audio.currentTime = 0;

    video.currentTime = 0;

    playButton.textContent = "PLAY";

});

</script>

</body>
</html>
