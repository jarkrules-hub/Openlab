<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OPENLAB</title>

<style>
body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 90%;
    max-width: 900px;
    text-align: center;
}

video {
    width: 100%;
    max-height: 60vh;
    object-fit: contain;
    display: block;
    margin: auto;
}

.logo {
    font-size: 13px;
    letter-spacing: 8px;
    opacity: 0.7;
    margin-bottom: 25px;
}

.track-number {
    margin-top: 25px;
    font-size: 12px;
    letter-spacing: 5px;
    opacity: 0.5;
}

.track-title {
    margin-top: 10px;
    font-size: 22px;
    letter-spacing: 3px;
}

button {
    margin-top: 25px;
    padding: 12px 40px;
    background: transparent;
    border: 1px solid #555;
    color: white;
    cursor: pointer;
    font-size: 12px;
    letter-spacing: 4px;
}

button:hover {
    background: white;
    color: black;
}

.tracks {
    margin-top: 30px;
}

.track {
    background: none;
    border: none;
    color: #555;
    margin: 0 8px;
    padding: 5px;
}

.track.active {
    color: white;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">OPENLAB</div>

    <video id="video" playsinline preload="metadata">
        <source src="./video1.mp4" type="video/mp4">
    </video>

    <div class="track-number">01</div>

    <div class="track-title">
        ХОТЕЛ БЫТЬ КАК ВСЕ
    </div>

    <button id="playButton">PLAY</button>

    <audio id="audio" preload="metadata">
        <source src="./track1.mp3" type="audio/mpeg">
    </audio>

    <div class="tracks">
        <button class="track active">01</button>
        <button class="track">02</button>
        <button class="track">03</button>
        <button class="track">04</button>
        <button class="track">05</button>
    </div>

</div>

<script>

const video = document.getElementById("video");
const audio = document.getElementById("audio");
const playButton = document.getElementById("playButton");

playButton.addEventListener("click", async function () {

    if (audio.paused) {

        try {
            await audio.play();
            await video.play();

            playButton.textContent = "PAUSE";

        } catch (error) {
            console.log(error);
            alert("Не удалось запустить аудио. Проверь файл track1.mp3.");
        }

    } else {

        audio.pause();
        video.pause();

        playButton.textContent = "PLAY";
    }

});

audio.addEventListener("ended", function () {

    video.pause();
    video.currentTime = 0;

    playButton.textContent = "PLAY";

});

</script>

</body>
</html>
