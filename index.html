<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OPENLAB</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 90%;
    max-width: 850px;
    text-align: center;
}

.logo {
    font-size: 13px;
    letter-spacing: 8px;
    opacity: 0.6;
    margin-bottom: 30px;
}

.video-box {
    width: 100%;
    background: #000;
}

video {
    width: 100%;
    max-height: 60vh;
    object-fit: contain;
    display: block;
}

.track-number {
    margin-top: 25px;
    font-size: 11px;
    letter-spacing: 5px;
    opacity: 0.45;
}

.track-title {
    margin-top: 10px;
    font-size: 21px;
    letter-spacing: 3px;
}

.play-button {
    margin-top: 25px;
    padding: 12px 38px;
    background: transparent;
    border: 1px solid #555;
    color: #fff;
    font-size: 11px;
    letter-spacing: 4px;
    cursor: pointer;
}

.play-button:hover {
    background: #fff;
    color: #000;
}

.tracks {
    margin-top: 35px;
    display: flex;
    justify-content: center;
    gap: 18px;
}

.track-button {
    background: transparent;
    border: none;
    color: #444;
    font-size: 11px;
    cursor: pointer;
}

.track-button.active {
    color: #fff;
}

@media (max-width: 600px) {

    .container {
        width: 94%;
    }

    video {
        max-height: 45vh;
    }

    .track-title {
        font-size: 17px;
    }

    .tracks {
        gap: 12px;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        OPENLAB
    </div>

    <div class="video-box">

        <video
            id="video"
            muted
            playsinline
            loop
            preload="auto"
        >
            <source src="video1.mp4" type="video/mp4">
        </video>

    </div>

    <div class="track-number" id="trackNumber">
        01
    </div>

    <div class="track-title" id="trackTitle">
        ХОТЕЛ БЫТЬ КАК ВСЕ
    </div>

    <button
        class="play-button"
        id="playButton">
        PLAY
    </button>

    <audio
        id="audio"
        preload="auto">
        <source src="track1.mp3" type="audio/mpeg">
    </audio>

    <div class="tracks">

        <button class="track-button active" data-track="1">
            01
        </button>

        <button class="track-button" data-track="2">
            02
        </button>

        <button class="track-button" data-track="3">
            03
        </button>

        <button class="track-button" data-track="4">
            04
        </button>

        <button class="track-button" data-track="5">
            05
        </button>

    </div>

</div>


<script>

const video = document.getElementById("video");
const audio = document.getElementById("audio");
const playButton = document.getElementById("playButton");

const trackNumber = document.getElementById("trackNumber");
const trackTitle = document.getElementById("trackTitle");

const trackButtons = document.querySelectorAll(".track-button");


const tracks = {

    1: {
        title: "ХОТЕЛ БЫТЬ КАК ВСЕ",
        audio: "track1.mp3",
        video: "video1.mp4"
    },

    2: {
        title: "БЛИЖЕ, ЧЕМ ВЕСЬ МИР",
        audio: "track2.mp3",
        video: "video2.mp4"
    },

    3: {
        title: "ТАНЕЦ УЛИТКИ",
        audio: "track3.mp3",
        video: "video3.mp4"
    },

    4: {
        title: "ЧЁРНЫЕ И БЕЛЫЕ ПОЛОСЫ",
        audio: "track4.mp3",
        video: "video4.mp4"
    },

    5: {
        title: "НАВСЕГДА",
        audio: "track5.mp3",
        video: "video5.mp4"
    }

};


let currentTrack = 1;
let isPlaying = false;


function loadTrack(number) {

    const track = tracks[number];

    currentTrack = number;

    audio.pause();
    video.pause();

    isPlaying = false;

    playButton.textContent = "PLAY";

    audio.src = track.audio;
    video.src = track.video;

    audio.load();
    video.load();

    trackNumber.textContent =
        String(number).padStart(2, "0");

    trackTitle.textContent = track.title;

    trackButtons.forEach(button => {

        button.classList.remove("active");

        if (button.dataset.track == number) {
            button.classList.add("active");
        }

    });

}


playButton.addEventListener("click", async function() {

    if (!isPlaying) {

        try {

            await audio.play();
            await video.play();

            isPlaying = true;

            playButton.textContent = "PAUSE";

        }

        catch (error) {

            console.log(error);

            alert(
                "Не удалось запустить воспроизведение."
            );

        }

    }

    else {

        audio.pause();
        video.pause();

        isPlaying = false;

        playButton.textContent = "PLAY";

    }

});


trackButtons.forEach(button => {

    button.addEventListener("click", function() {

        const number =
            Number(this.dataset.track);

        /*
        Пока у нас реально готовы
        только 01 и 02.
        */

        if (number === 1 || number === 2) {

            loadTrack(number);

        }

    });

});


audio.addEventListener("ended", function() {

    audio.pause();
    video.pause();

    audio.currentTime = 0;
    video.currentTime = 0;

    isPlaying = false;

    playButton.textContent = "PLAY";

});


loadTrack(1);

</script>

</body>
</html>
